<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff2f86">
  <title>RecipeBounty — MVP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="RecipeBounty home">
        <span class="brand-mark">R</span>
        <span class="brand-text">RecipeBounty</span>
      </button>
      <div class="top-search">
        <span class="search-icon">⌕</span>
        <input id="globalSearch" type="search" placeholder="Search recipes, cuisines, creators…" autocomplete="off">
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="chatBtn" title="Global Chat">💬</button>
        <button class="icon-btn" id="messagesBtn" title="Messages">✉</button>
        <button class="avatar-btn" id="avatarBtn" title="Profile">HS</button>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-route="home"><span>⌂</span><small>Home</small></button>
      <button data-route="reels"><span>▶</span><small>Reels</small></button>
      <button data-route="discover"><span>⌕</span><small>Discover</small></button>
      <button data-route="create" class="create-nav"><span>＋</span><small>Create</small></button>
      <button data-route="industry"><span>⌁</span><small>Industry</small></button>
      <button data-route="treasure"><span>◇</span><small>Treasure</small></button>
      <button data-route="profile"><span>◎</span><small>Profile</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script src="app.js" defer></script>
</body>
</html>
