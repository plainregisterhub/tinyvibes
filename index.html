<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="TinyVibes Prototype 0.1 - Empty Planet Interface" />
  <title>TinyVibes — Empty Planet (Prototype 0.1)</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app-shell" role="application">
    <!-- A. Minimal Fantasy Sky Background Layer -->
    <div class="sky-background" aria-hidden="true">
      <div class="sky-gradient"></div>
      <div class="sky-stars"></div>
      <div class="distant-moon"></div>
      <div class="distant-island island-left"></div>
      <div class="distant-island island-right"></div>
      <div class="distant-clouds"></div>
    </div>

    <!-- B. Header Region -->
    <header class="app-header">
      <div class="header-branding">
        <h1 class="brand-title">TinyVibes</h1>
        <p class="brand-tagline">Small Things. Big Worlds.</p>
      </div>
      <div class="header-actions">
        <button id="fullscreen-btn" class="icon-btn" type="button" aria-label="Enter Fullscreen" title="Toggle Fullscreen">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- C. Main Gameplay Board / Canvas -->
    <main id="gameplay-canvas" class="gameplay-canvas" aria-label="Empty Planet Canvas">
      <div class="planet-anchor">
        <div id="planet" class="planet" role="img" aria-label="A calm, empty pastel blue-lavender spherical planet"></div>
      </div>
    </main>

    <!-- D. Bottom Control Region (Toolbar & Storage) -->
    <section class="bottom-controls" aria-label="Controls and Slot Bar">
      <div class="toolbar-wrapper">
        <!-- 10-Slot Single Row Strip -->
        <div id="slot-strip" class="slot-strip" role="tablist" aria-label="Active 10-slot selection bar">
          <!-- Generated via JS: Slots 1 to 10 -->
        </div>

        <!-- Storage Trigger Button -->
        <button id="storage-open-btn" class="storage-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="storage-dialog" aria-label="Open Storage">
          <span class="storage-icon" aria-hidden="true">🎒</span>
          <span class="storage-label">Storage</span>
        </button>
      </div>
    </section>

    <!-- E. Footer Region -->
    <footer class="app-footer">
      <p class="footer-note">TinyVibes Prototype 0.1 &bull; Still Building. &hearts;</p>
    </footer>

    <!-- F. Storage Modal Panel -->
    <div id="storage-dialog" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="storage-title" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="storage-title" class="modal-title">Storage</h2>
          <button id="storage-close-btn" class="modal-close-btn" type="button" aria-label="Close Storage">&times;</button>
        </div>
        <div class="modal-body">
          <div class="empty-state">
            <div class="empty-icon" aria-hidden="true">&#9729;</div>
            <p class="empty-title">No Collectibles Stored</p>
            <p class="empty-desc">Items and inventory systems are not available in Prototype 0.1 yet. The planet is currently an empty board awaiting future asset modules.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="storage-confirm-btn" class="btn-primary" type="button">Close</button>
        </div>
      </div>
    </div>

    <!-- G. Non-disruptive Toast Notification (For fallback) -->
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
