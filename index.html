<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TinyVibes — Liquid V6.4</title>
<style>
:root{
  --bg:#071425;
  --panel:#0d1c30;
  --panel2:#10243d;
  --ink:#f5f8ff;
  --muted:#9db0c9;
  --line:rgba(255,255,255,.10);
  --accent:#9fd7ff;
  --shadow:0 20px 60px rgba(0,0,0,.36);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 20% 0%,rgba(96,157,230,.12),transparent 28%),
  var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button{font:inherit}
.app{width:min(1180px,100%);margin:0 auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand h1{font-size:24px;line-height:1;margin:0}
.brand p{margin:5px 0 0;color:var(--muted);font-size:12px}
.badge{border:1px solid rgba(159,215,255,.26);background:rgba(91,146,214,.18);
  padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}

.scene{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px}
.planetPanel,.libraryPanel{border:1px solid var(--line);background:rgba(255,255,255,.025);
  border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.planetStage{position:relative;width:min(100%,680px);aspect-ratio:1/1;margin:auto;
  user-select:none;touch-action:none}
.planetShell{position:absolute;inset:5%;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 32% 25%,rgba(255,255,255,.45),transparent 16%),
    radial-gradient(circle at 34% 27%,#1ff2d9 0%,#8de6d0 13%,#f4dfbd 39%,#edbf76 100%);
  box-shadow:inset -18px -25px 40px rgba(128,78,40,.20),
    inset 8px 10px 28px rgba(255,255,255,.22),
    0 18px 38px rgba(0,0,0,.40)}
.planetShell:after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 68% 72%,transparent 42%,rgba(77,46,29,.10) 100%);
  pointer-events:none}
.surfaceLayer{position:absolute;inset:5%;border-radius:50%;overflow:hidden;z-index:2;pointer-events:none}
.surfaceSvg{display:block;width:100%;height:100%}
.objectLayer{position:absolute;inset:5%;border-radius:50%;z-index:3}
.object-anchor{position:absolute;width:1px;height:1px;transform:translate(-50%,-50%);pointer-events:none}
.object-rot{transform:rotate(var(--rot,0deg));transform-origin:center}
.object-anim{width:var(--size);height:var(--size);position:relative;pointer-events:auto;
  cursor:grab;touch-action:none;display:grid;place-items:center}
.object-anim:active{cursor:grabbing}
.object-anim.selected:after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:2px dashed var(--accent);animation:rotateRing 8s linear infinite}
@keyframes rotateRing{to{transform:rotate(360deg)}}
.asset-art{width:100%;height:100%;display:grid;place-items:center;filter:drop-shadow(0 5px 7px rgba(0,0,0,.25))}
.asset-art .shape{width:76%;height:76%;border-radius:50%;display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.45);box-shadow:inset -5px -7px 10px rgba(0,0,0,.15),
  0 5px 10px rgba(0,0,0,.18)}
.asset-art .emoji{font-size:clamp(18px,4vw,34px);line-height:1}
.instruction{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin-top:12px}
.instruction b{color:var(--ink)}

.libraryPanel{display:flex;flex-direction:column;min-height:0}
.libraryHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.libraryHead h2{font-size:17px;margin:0}
.libraryHead p{font-size:11px;color:var(--muted);margin:4px 0 0}
.clearBtn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);
  border-radius:10px;padding:7px 9px;cursor:pointer}
.clearBtn:hover{background:rgba(255,255,255,.08)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;
  overflow-y:auto;max-height:560px;padding-right:2px}
.card{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;
  padding:8px;display:flex;gap:8px;align-items:center;color:inherit;cursor:pointer;
  text-align:left;min-width:0}
.card:hover{background:rgba(255,255,255,.07)}
.card.armed{border-color:var(--accent);background:rgba(159,215,255,.15)}
.thumb{width:48px;height:48px;flex:0 0 48px;background:rgba(0,0,0,.18);
  border-radius:9px;overflow:hidden;display:grid;place-items:center}
.thumb .shape{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.4)}
.thumb .emoji{font-size:21px}
.cardText{min-width:0}
.cardText strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardText span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.status{margin-top:auto;padding-top:12px;color:var(--muted);font-size:11px;min-height:26px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);
  background:#0b1d33;border:1px solid var(--line);color:#fff;padding:8px 16px;
  border-radius:999px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:24px 10px;font-size:12px}

@media(max-width:800px){
  .app{padding:12px}
  .scene{grid-template-columns:1fr}
  .cards{max-height:none}
}
@media(max-width:430px){
  .topbar{align-items:flex-start}
  .badge{font-size:10px;padding:7px 9px}
  .planetPanel,.libraryPanel{padding:12px;border-radius:19px}
  .cards{grid-template-columns:1fr 1fr}
  .thumb{width:42px;height:42px;flex-basis:42px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>TinyVibes</h1>
      <p>Build your little world.</p>
    </div>
    <div class="badge">Liquid V6.4 • Rebuilt</div>
  </header>

  <main class="scene">
    <section class="planetPanel">
      <div id="planetStage" class="planetStage" aria-label="TinyVibes planet">
        <div class="planetShell"></div>
        <div class="surfaceLayer">
          <svg id="surfaceSvg" class="surfaceSvg" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
        </div>
        <div id="objectLayer" class="objectLayer"></div>
      </div>

      <div class="instruction">
        <b>Tap Card</b> → tap planet to place &nbsp; • &nbsp;
        <b>Tap Object</b> → rotate +15° &nbsp; • &nbsp;
        <b>Drag Object</b> → move
      </div>
    </section>

    <aside class="libraryPanel">
      <div class="libraryHead">
        <div>
          <h2>Little Things</h2>
          <p>Choose something, then place it on your planet.</p>
        </div>
        <button id="clearBtn" class="clearBtn" type="button">Clear</button>
      </div>
      <div id="cards" class="cards"></div>
      <div id="status" class="status"></div>
    </aside>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

const ASSETS = [
  {id:"tree",     name:"Tiny Tree",    category:"Nature",   emoji:"🌳", color:"#65c97b", size:.13},
  {id:"flower",   name:"Flower",       category:"Nature",   emoji:"🌼", color:"#f5c96a", size:.10},
  {id:"mushroom", name:"Mushroom",     category:"Nature",   emoji:"🍄", color:"#e96f67", size:.105},
  {id:"matcha",   name:"Matcha",       category:"Drink",    emoji:"🍵", color:"#9bd38b", size:.11},
  {id:"cake",     name:"Tiny Cake",    category:"Food",     emoji:"🍰", color:"#e8a6b9", size:.11},
  {id:"house",    name:"Little House", category:"Structure",emoji:"🏠", color:"#d79c72", size:.14},
  {id:"tent",     name:"Camp Tent",   category:"Structure",emoji:"⛺", color:"#7fa7d8", size:.13},
  {id:"beaver",   name:"Busy Beaver", category:"Character", emoji:"🦫", color:"#a87552", size:.14},
  {id:"cloud",    name:"Cloud",        category:"Atmosphere",emoji:"☁️", color:"#dceeff", size:.15},
  {id:"star",     name:"Star",         category:"Effect",   emoji:"⭐", color:"#f5dc78", size:.09}
];

const state = {
  items:new Map(),
  armed:null,
  selected:null,
  drag:null,
  nextId:1
};

const planetStage = document.getElementById("planetStage");
const objectLayer = document.getElementById("objectLayer");
const surfaceSvg = document.getElementById("surfaceSvg");
const cards = document.getElementById("cards");
const status = document.getElementById("status");
const toast = document.getElementById("toast");
const clearBtn = document.getElementById("clearBtn");

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[ch]));
}

function assetMarkup(asset, small=false){
  return `<div class="asset-art">
    <div class="shape" style="background:${asset.color}">
      <span class="emoji">${escapeHtml(asset.emoji)}</span>
    </div>
  </div>`;
}

function renderCards(){
  cards.innerHTML = ASSETS.map(asset => `
    <button class="card ${state.armed===asset.id ? "armed":""}" type="button" data-asset="${asset.id}">
      <span class="thumb">
        <span class="shape" style="background:${asset.color}">
          <span class="emoji">${escapeHtml(asset.emoji)}</span>
        </span>
      </span>
      <span class="cardText">
        <strong>${escapeHtml(asset.name)}</strong>
        <span>${escapeHtml(asset.category)}</span>
      </span>
    </button>
  `).join("");

  cards.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click",()=>{
      state.armed = card.dataset.asset;
      setSelected(null);
      renderCards();
      showToast("Now tap the planet");
    });
  });

  status.textContent = state.armed
    ? `Selected: ${ASSETS.find(a=>a.id===state.armed).name} — tap anywhere inside the planet.`
    : `${state.items.size} object${state.items.size===1?"":"s"} placed.`;
}

function setSelected(id){
  state.selected = id;
  state.items.forEach(item=>{
    if(item.dom) item.dom.anim.classList.toggle("selected", item.id===id);
  });
}

function spawnObject(asset,x,y){
  const id = "obj-" + state.nextId++;
  const item = {
    id, assetId:asset.id, x, y, rotation:0,
    dom:null
  };

  const anchor = document.createElement("div");
  anchor.className = "object-anchor";
  anchor.style.left = (x*100)+"%";
  anchor.style.top = (y*100)+"%";

  const rot = document.createElement("div");
  rot.className = "object-rot";

  const anim = document.createElement("div");
  anim.className = "object-anim";
  anim.style.setProperty("--size", `clamp(48px, ${Math.round(asset.size*100)}%, 92px)`);
  anim.innerHTML = assetMarkup(asset);

  anim.addEventListener("pointerdown", e => onPointerDown(e,item));

  rot.appendChild(anim);
  anchor.appendChild(rot);
  objectLayer.appendChild(anchor);

  item.dom = {anchor,rot,anim};
  state.items.set(id,item);
  setSelected(id);
  renderLiquid(item);
}

function renderLiquid(item){
  const asset = ASSETS.find(a=>a.id===item.assetId);
  if(!asset) return;

  let circle = surfaceSvg.querySelector(`circle[data-id="${item.id}"]`);
  if(!circle){
    circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("data-id",item.id);
    circle.setAttribute("opacity","0.28");
    surfaceSvg.appendChild(circle);
  }
  circle.setAttribute("cx", item.x*1000);
  circle.setAttribute("cy", item.y*1000);
  circle.setAttribute("r", (asset.size*1000*.55).toFixed(0));
  circle.setAttribute("fill", asset.color);
}

function onPointerDown(e,item){
  e.stopPropagation();
  setSelected(item.id);
  state.drag = {
    id:item.id,
    pointerId:e.pointerId,
    startX:e.clientX,
    startY:e.clientY,
    origX:item.x,
    origY:item.y,
    moved:false
  };
  e.currentTarget.setPointerCapture(e.pointerId);
}

window.addEventListener("pointermove", e=>{
  if(!state.drag) return;
  const item = state.items.get(state.drag.id);
  if(!item) return;

  const dx = e.clientX-state.drag.startX;
  const dy = e.clientY-state.drag.startY;

  if(Math.hypot(dx,dy)>8) state.drag.moved=true;

  if(state.drag.moved){
    const rect=planetStage.getBoundingClientRect();
    item.x=Math.min(.94,Math.max(.06,state.drag.origX+dx/rect.width));
    item.y=Math.min(.94,Math.max(.06,state.drag.origY+dy/rect.height));
    item.dom.anchor.style.left=(item.x*100)+"%";
    item.dom.anchor.style.top=(item.y*100)+"%";
    renderLiquid(item);
  }
});

window.addEventListener("pointerup",()=>{
  if(!state.drag) return;
  const item=state.items.get(state.drag.id);

  if(item && !state.drag.moved){
    item.rotation=(item.rotation+15)%360;
    item.dom.rot.style.setProperty("--rot",item.rotation+"deg");
    showToast(`Rotated ${item.rotation}°`);
  }
  state.drag=null;
});

planetStage.addEventListener("pointerdown",e=>{
  if(e.target.closest(".object-anim")) return;

  if(state.armed){
    const asset=ASSETS.find(a=>a.id===state.armed);
    const rect=planetStage.getBoundingClientRect();

    let x=(e.clientX-rect.left)/rect.width;
    let y=(e.clientY-rect.top)/rect.height;

    const dx=x-.5, dy=y-.5;
    if(Math.hypot(dx,dy)>.47){
      const angle=Math.atan2(dy,dx);
      x=.5+Math.cos(angle)*.43;
      y=.5+Math.sin(angle)*.43;
    }

    spawnObject(asset,x,y);
    state.armed=null;
    renderCards();
    showToast("Object placed");
  }else{
    setSelected(null);
  }
});

clearBtn.addEventListener("click",()=>{
  state.items.forEach(item=>{
    item.dom?.anchor.remove();
    surfaceSvg.querySelector(`circle[data-id="${item.id}"]`)?.remove();
  });
  state.items.clear();
  state.armed=null;
  state.selected=null;
  renderCards();
  showToast("Planet cleared");
});

function showToast(message){
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>toast.classList.remove("show"),1200);
}

renderCards();
</script>
</body>
</html>
