<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TinyVibes — Liquid V6</title>
<style>
:root{
  --bg:#071425; --bg2:#0b1d33; --ink:#f5f8ff; --muted:#9db0c9;
  --line:rgba(255,255,255,.10); --glass:rgba(8,20,37,.78);
  --accent:#9fd7ff; --planet:#f4dfbd; --planetHi:#fff2d9;
  --shadow:0 20px 60px rgba(0,0,0,.36);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 20% 0%,rgba(96,157,230,.12),transparent 28%),
 radial-gradient(circle at 90% 20%,rgba(78,118,190,.10),transparent 30%),var(--bg);color:var(--ink);
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button{font:inherit}
.app{width:min(1180px,100%);margin:0 auto;padding:18px 18px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#8ad5ff,#74a5ee);box-shadow:0 12px 30px rgba(54,117,199,.28);font-size:22px}
.brand h1{font-size:24px;line-height:1;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.badge{border:1px solid rgba(159,215,255,.26);background:rgba(91,146,214,.18);padding:9px 13px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap}
.scene{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(310px,.75fr);gap:16px;align-items:stretch}
.planetPanel,.libraryPanel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.planetPanel{padding:16px;display:flex;flex-direction:column;min-height:640px}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.panelHead h2{font-size:15px;margin:0}.panelHead span{font-size:11px;color:var(--muted)}
.planetStage{position:relative;width:min(100%,720px);aspect-ratio:1/1;margin:auto;display:grid;place-items:center;touch-action:none;user-select:none;isolation:isolate}
.planetShell{position:absolute;inset:5%;border-radius:50%;overflow:visible;z-index:1}
.planetBase{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:
 radial-gradient(circle at 34% 26%,var(--planetHi) 0 9%,rgba(255,249,231,.96) 20%,rgba(245,225,191,.98) 62%,#edbf76 100%);
 box-shadow:inset -12px -20px 34px rgba(128,78,40,.15),inset 9px 10px 18px rgba(255,255,255,.35),0 18px 38px rgba(0,0,0,.28)}
.planetBase:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 68% 71%,rgba(208,140,67,.13),transparent 19%),
 radial-gradient(circle at 24% 64%,rgba(224,169,92,.10),transparent 22%),
 radial-gradient(circle at 78% 24%,rgba(255,255,255,.15),transparent 22%);
 mix-blend-mode:multiply;opacity:.75}
.surfaceLayer{position:absolute;inset:5%;border-radius:50%;overflow:hidden;z-index:2;clip-path:circle(50% at 50% 50%);pointer-events:none}
.surfaceSvg{width:100%;height:100%;display:block;overflow:visible}
.liquidPatch{transition:opacity .25s ease;transform-origin:center;}
.patchMorph{transform-origin:center;}
.objectLayer{position:absolute;inset:5%;border-radius:50%;z-index:3;overflow:visible;pointer-events:none}
.object-anchor{position:absolute;width:1px;height:1px;left:50%;top:50%;pointer-events:none}
.object-rot{position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotate(var(--rot,0deg));transform-origin:center;pointer-events:none}
.object-anim{width:var(--size);height:var(--size);position:relative;transform:scale(1);pointer-events:auto;touch-action:none;cursor:grab}
.object-anim:active{cursor:grabbing}.object-anim.selected:after{content:"";position:absolute;inset:-5px;border-radius:28%;border:1.5px solid rgba(255,255,255,.6);box-shadow:0 0 0 4px rgba(255,255,255,.06);pointer-events:none}
.object-anim img,.placeholder{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 7px 6px rgba(55,30,16,.17));-webkit-user-drag:none}
.placeholder{border-radius:25%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--size)*.22);background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.instruction{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}.instruction b{color:#dde9f9}
.devToggle{margin-top:auto;align-self:flex-end;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#b7c7da;padding:7px 10px;border-radius:999px;font-size:10px}
.devPanel{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.devPanel.open{display:block}.devGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.devGrid button{border:1px solid var(--line);background:rgba(255,255,255,.045);color:#d6e2f0;padding:7px 4px;border-radius:10px;font-size:10px}.devMeta{margin-top:8px;font-size:9px;color:#7f94ad;line-height:1.45}
.libraryPanel{padding:14px;display:flex;flex-direction:column;min-height:640px}.libraryHead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px}.libraryHead h3{margin:0;font-size:16px}.count{color:var(--muted);font-size:10px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:2px;margin-bottom:10px}.tabs button{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#b7c7da;padding:7px 10px;border-radius:999px;font-size:10px}.tabs button.active{background:rgba(159,215,255,.15);color:#eff8ff;border-color:rgba(159,215,255,.33)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:auto;padding-right:2px}.card{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:16px;padding:8px;display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;min-width:0;text-align:left;color:inherit}.card:active{transform:scale(.985)}.thumb{width:58px;height:58px;border-radius:13px;background:rgba(255,255,255,.05);overflow:hidden;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:contain}.cardMeta{min-width:0}.cardName{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardSub{font-size:9px;color:var(--muted);margin-top:3px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.chip{font-size:8px;border:1px solid rgba(255,255,255,.09);padding:2px 5px;border-radius:999px;color:#a9bdd3}.chip.tier{color:#d8edff}.card.armed{border-color:rgba(159,215,255,.55);box-shadow:0 0 0 2px rgba(159,215,255,.08)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(15px);background:rgba(7,17,30,.93);border:1px solid rgba(255,255,255,.12);color:#eff7ff;padding:9px 12px;border-radius:999px;font-size:11px;opacity:0;pointer-events:none;transition:.22s ease;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;color:#8fa5bd;font-size:9px;margin-top:10px}.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
@media (max-width:900px){.scene{grid-template-columns:1fr}.planetPanel,.libraryPanel{min-height:unset}.planetPanel{min-height:0;padding-bottom:12px}.planetStage{width:min(94vw,700px)}.cards{max-height:380px}}
@media (max-width:520px){.app{padding:12px 10px 20px}.topbar{margin-bottom:10px}.brand h1{font-size:21px}.brand p{font-size:11px}.logo{width:38px;height:38px}.badge{font-size:10px;padding:8px 10px}.planetPanel,.libraryPanel{border-radius:20px}.planetPanel{padding:11px}.planetStage{width:min(94vw,420px)}.cards{grid-template-columns:1fr;max-height:none}.card{grid-template-columns:64px 1fr}.thumb{width:64px;height:64px}.instruction{font-size:10px}.devGrid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
</style>
</head>

function tick(now){const dt=Math.min(50,now-last);last=now;motionT+=dt;const t=motionT/1000;const mode=state.densityMode;surfaceSvg.querySelectorAll('.liquidPatch').forEach((g,i)=>{const item=state.items.get(g.dataset.id);if(!item)return;const a=assetById(item.assetId),cfg=effectCfg(a);let s=.006*TIER_FLOW[a.tier||'Basic'];if(cfg.motion==='spiral')s=.018;else if(cfg.motion==='ganache')s=.010;else if(cfg.motion==='fizz')s=.020;else if(cfg.motion==='arcane'||cfg.motion==='arcanePink')s=.015; if(mode==='minimal')s*=.55; const x=item.x*1000,y=item.y*1000,r=currentR(item);const phase=hashString(item.id)*6.28;const driftX=Math.sin(t*s*11+phase)*r*.018 + Math.sin(t*s*4.7+phase*1.7)*r*.010; const driftY=Math.cos(t*s*9+phase)*r*.013 + Math.sin(t*s*3.9+phase*1.3)*r*.008; const pulse=1+Math.sin(t*s*42+phase)*.010; g.style.transform=`translate(${driftX}px ${driftY}px) scale(${pulse})`; const p2=g.querySelector('.patchMorph'); if(p2)p2.style.opacity=mode==='minimal'?'0':String(.18+.10*(Math.sin(t*.7+phase)+1)/2);const sheen=g.querySelector('.sheen');if(sheen&&mode!=='minimal')sheen.setAttribute('opacity',String(.08+.05*(Math.sin(t*.9+phase)+1)/2));});requestAnimationFrame(tick)}requestAnimationFrame(tick);

(async()=>{assets=validateAssets(EMBEDDED_MANIFEST.assets);await loadManifest();loadState();renderAll();if(manifestOffline)showToast('Offline manifest — built-in data loaded');})();
